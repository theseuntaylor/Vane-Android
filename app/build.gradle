plugins {
    id 'com.android.application'
    id 'com.google.dagger.hilt.android'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = 'com.theseuntaylor.vane'
    compileSdk = 37

    defaultConfig {
        applicationId = "com.theseuntaylor.vane"
        minSdk = 24
        targetSdk = 37
        versionCode = 3
        versionName = "1.0.1"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }

        buildConfigField "String", "BASE_URL", baseUrl
        buildConfigField("Long", "REQUEST_TIMEOUT", requestTimeOut)
    }

    buildTypes {
        release {
            // R8 shrinks and obfuscates the code; resource shrinking drops what it no longer references.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        // java.time (forecast timestamps) needs API 26; desugaring backports it to minSdk 24.
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        compose = true
        buildConfig = true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation 'androidx.core:core-ktx:1.19.1'
    // Must match the Kotlin version AGP compiles with (see the plugins in build.gradle), not the newest release.
    //noinspection GradleDependency
    implementation platform('org.jetbrains.kotlin:kotlin-bom:2.2.10')
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'com.google.android.gms:play-services-location:21.4.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.09.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Material 3 and Navigation Dependencies
    implementation 'androidx.navigation:navigation-compose:2.10.2'

    // Coroutines Dependencies
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // Retrofit and OkHttp Dependencies
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.5.1'

    // Room Dependencies
    implementation 'androidx.room:room-common:2.8.5'
    implementation 'androidx.room:room-ktx:2.8.5'

    ksp 'androidx.room:room-compiler:2.8.5'
    androidTestImplementation 'androidx.room:room-testing:2.8.5'

    // Hilt Dependencies
    implementation 'com.google.dagger:hilt-android:2.60.1'
    ksp 'com.google.dagger:hilt-compiler:2.60.1'

    implementation 'androidx.hilt:hilt-work:1.4.0'
    ksp 'androidx.hilt:hilt-compiler:1.4.0'
    implementation 'androidx.work:work-runtime-ktx:2.12.0'

    // Home screen widget
    implementation 'androidx.glance:glance-appwidget:1.2.0'
    implementation 'androidx.glance:glance-material3:1.2.0'
    implementation 'androidx.hilt:hilt-navigation-compose:1.4.0'

    // 1.9.x is the release for Kotlin 2.2; newer ones are built with Kotlin 2.4, which this compiler can't read.
    //noinspection NewerVersionAvailable
    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0")
}
