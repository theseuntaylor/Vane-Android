# Updates the Google Play store listing from fastlane/metadata/android: the title, short and full
# descriptions, and phone screenshots. Run it by hand from the Actions tab.
#
# "validate" (the default) only asks Play to check the listing. "upload" replaces the live listing,
# including every phone screenshot.
#
# Repository secret used: SERVICE_ACCOUNT_JSON (the Play service account key as plain JSON).
name: Store listing

on:
  workflow_dispatch:
    inputs:
      mode:
        description: validate checks the listing with Play; upload replaces the live listing
        type: choice
        options:
          - validate
          - upload
        default: validate

permissions:
  contents: read

concurrency:
  group: store-listing
  cancel-in-progress: false

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Check the listing files
        run: scripts/e2e/store_listing.sh

      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: ${{ inputs.mode == 'upload' && 'Upload the listing to Play' || 'Validate the listing with Play' }}
        env:
          PLAY_JSON_KEY_DATA: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        run: bundle exec fastlane ${{ inputs.mode == 'upload' && 'upload_listing' || 'validate_listing' }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: store-listing-check
          path: build/e2e/store-listing-*.md
